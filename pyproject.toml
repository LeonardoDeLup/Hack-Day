[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fruit-assessment"
version = "0.1.0"
description = "Local fruit identification and visual ripeness assessment with Ollama"
requires-python = ">=3.12"
dependencies = [
  "ollama==0.6.3",
  "Pillow==13.0.0",
  "pydantic==2.14.4",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "mypy==2.4.1", "nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0", "jsonschema==4.26.0"]

[project.scripts]
fruit-analyze = "fruit_backend.cli:main"
fruit-evaluate = "fruit_backend.evaluation:main"

[tool.setuptools.packages.find]
include = ["fruit_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running local Ollama model (opt-in)"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["fruit_backend"]
